<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><meta name="robots" content="noindex,nofollow"><title>Объективка участника · Советы Первых</title>
<style>

78px;border:1px dashed #b9bcbc;border-radius:8px;display:grid;place-items:center;background:#f6f6f4;color:#676b70;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:contain}.note{font-size:14px}.photoRow .note{margin-top:5px}.remove{margin-left:4px}.cta{width:100%;min-height:50px;border:0;background:#b91630;color:white;font-size:17px}.cta:hover{background:#a10f26}.cta:disabled{opacity:.6}.status{margin:8px 0;color:#555;font-size:14px}.panel{position:sticky;top:14px;background:#e9e9e6;border:1px solid #dcdcd7;border-radius:16px;padding:18px 22px 22px}.panel summary{font-weight:680;list-style:none;padding-bottom:14px}.panel summary::-webkit-details-marker{display:none}.panel summary span{float:right;color:#606465;font-size:14px;font-weight:500}.paper{width:100%;min-height:0;aspect-ratio:210/297;background:white;box-shadow:0 2px 7px #25251e16;padding:8% 9%;font:clamp(12px,1.05vw,15px)/1.18 "Times New Roman",serif;color:#151515;overflow-wrap:anywhere}.paper .pic{width:31%;aspect-ratio:0.86;display:grid;place-items:center;border:1px solid #555;padding:4px;margin-bottom:12px}.pic img{width:100%;aspect-ratio:1;object-fit:cover}.pic.empty{border:1px dashed #c3c4c0;background:#f8f8f6;font:12px system-ui;color:#717572}.center{text-align:center}.paper section{margin-top:12px}.paper p{margin:0;text-indent:1.5em;text-align:justify;white-space:pre-line}.paper .muted{color:#777}.paper .line{text-align:left}.note.privacy{margin-top:8px;text-align:center}.mobileAction{display:none}svg{display:block}
@media(max-width:800px){.wrap,main{padding-left:16px;padding-right:16px}.wrap{height:54px}.intro{margin:24px 0 18px}.layout{display:flex;flex-direction:column;gap:14px}.layout>*{width:100%}.card{padding:20px;margin-bottom:12px}.panel{position:static;padding:14px 16px}.panel summary{padding:0}.panel[open] summary{padding-bottom:12px}.paper{font-size:14px}.panel{order:1}form{order:0}.mobileAction{display:block;margin:10px 0;background:none;color:#9e1329;border:0;padding:8px 0}.intro p{font-size:15px}.photoRow{gap:10px}.remove{padding:8px}.wrap{font-size:15px}}
</style></head><body>
<header><div class="wrap"><span class="mark" aria-hidden="true"></span>Советы Первых 19</div></header>
<main><div class="intro"><h1>Объективка участника</h1><p>Добавь фото, заполни сведения о себе и скачай готовый документ Word.</p></div>
<div class="layout"><form id="form" autocomplete="off"><div class="card"><h2>Личные данные</h2>
<div class="photoRow"><div class="avatar" id="avatar"></div><div><label class="pick"><span id="pickText">Добавить фото</span><input id="upload" aria-required="true" aria-describedby="photoStatus" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif" aria-label="Выбрать фотографию"></label><button class="remove" type="button" id="remove" hidden>Убрать</button><div class="note">Фото обязательно для скачивания Word</div></div></div><div role="status" id="photoStatus" class="status"></div>
<label class="field">Фамилия, имя и отчество<input id="name" required placeholder="Как указать в документе"></label>
<label class="field">Учебное заведение и класс или курс<input id="school" placeholder="Например, школа № 5, 9 класс"></label>
<label class="field">Дата, на которую актуальны сведения<input id="date" type="date"></label>
<label class="field">Место проживания<input id="place" placeholder="Регион, район, населённый пункт"></label></div>
<div class="card"><h2>Интересы и деятельность</h2>
<label class="field">Сфера интересов<input id="interests" placeholder="Например, волонтёрство, фотография, спорт"></label>
<label class="field">Общественная деятельность<textarea id="activity" placeholder="Каждую роль или занятие укажи с новой строки"></textarea></label>
<label class="field">Награды и достижения<textarea id="awards" placeholder="Название конкурса, результат, год"></textarea></label>
<label class="field">История, реализованный проект или мечта<textarea id="story" rows="4" placeholder="Расскажи о себе от третьего лица. Что уже удалось сделать? Что хочется осуществить?"></textarea></label></div>
<button type="button" id="see" class="mobileAction">Посмотреть документ</button>
<button class="cta" id="save">Скачать Word (.docx)</button><div class="note privacy">Текст и фото обрабатываются на твоём устройстве.</div><div role="status" id="status" class="status"></div></form>
<details class="panel" id="panel" open><summary>Предпросмотр <span>Лист А4</span></summary><div id="preview" class="paper"></div></details>
</div></main><script src="/docx.min.js"></script><script src="/objektivka.js"></script></body></html>
